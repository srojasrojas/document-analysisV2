paths:
  input_dir: data/input
  output_dir: data/output
  reports_dir: reports
  changes_report: reports/changes.jsonl
  registry_report: reports/registro_cambios.xlsx
  reference_excel: tmp/referencia.xlsx
  reference_summary: reports/referencia_resumen.md

models:
  deepseek-r1-distill-14b-local:
    provider: ollama
    deployment: deepseek-r1:14b
    base_url: http://192.168.0.24:11434/v1
    api_key: ollama
  openai_api:
    provider: openai
    deployment_env: OPENAI_MODEL
    deployment: gpt-5.4-nano
    api_key_env: OPENAI_API_KEY

pipeline:
  max_passes: 3
  use_llm_refine: true
  overwrite_output: false
  skip_heading_styles: true
  dry_run_keeps_output: false

llm_refine:
  model: deepseek-r1-distill-14b-local
  temperature: 0.0
  timeout_seconds: 180
  repair_retries: 1

rules:
  - id: operador_to_spence
    enabled: true
    category: role_expansion
    description: Expand operator responsibility to Spence-designated personnel.
    detection:
      regex: "(?i)(?<![A-Za-z0-9_])operador(?:a|es|as)?(?:\\s+(?:(?:de|del)\\s+)?(?:planta(?:\\s+concentradora)?|equipo|terreno|sala(?:\\s+de\\s+control)?|control|zona\\s+aut[oó]noma|puente\\s+gr[uú]a|cam[ií]on|camioneta|mina|[aá]rea|proceso|procesos|chancado|molienda|flotaci[oó]n|relaves|maquinaria|operaciones))?(?![A-Za-z0-9_])"
    replacement:
      mode: expansion
      target_phrase: personal designado por minera Spence
      connector: o
      format: "{matched} {connector} {target}"
    guards:
      skip_if_target_exists_in_paragraph: false
      skip_if_alternative_exists: true
      alternative_pattern: "(?i)^\\s*(?:o|/|y/o)\\s+(?!personal\\s+designado\\s+por\\s+minera\\s+Spence)"
      review_only_patterns:
        - "(?i)\\bperfil\\s+del\\s+operador\\b"
        - "(?i)\\breemplazos?\\s+de\\s+operador\\b"
    llm_refining:
      enabled: true
      gate_prompt: prompts/rules/operador_gate.md
      constructor_prompt: prompts/rules/operador_constructor.md
      validate_target_in_output: true
      max_tokens: 700
      min_original_overlap_ratio: 0.65
      max_length_ratio: 1.8

  - id: supervisor_to_area_execs
    enabled: true
    category: role_expansion
    description: Expand supervisor responsibility to include Area Executives.
    detection:
      regex: "(?i)(?<![A-Za-z0-9_])(?:supervisor(?:a)?\\s+(?:de|del)\\s+(?:turno|[aá]rea|operaciones?|mantenci[oó]n|producci[oó]n|planta|terreno|zona(?:\\s+aut[oó]noma)?|sala(?:\\s+de\\s+control)?)|supervisor\\s*\\([ae]\\)|jefe\\s+de\\s+[aá]rea|due[ñn]o\\s+de\\s+[aá]rea|supervisor(?:a|es|as)?)(?![A-Za-z0-9_])"
    replacement:
      mode: expansion
      target_phrase: Ejecutivos del Área
      connector: o
      format: "{matched} {connector} {target}"
    guards:
      skip_if_target_exists_in_paragraph: false
      skip_if_alternative_exists: true
      alternative_pattern: "(?i)^\\s*(?:o|/|y/o)\\s+(?!Ejecutivos\\s+del\\s+[AÁ]rea)"
      exempt_context_patterns:
        - "(?i)sala\\s+de\\s+control"
        - "(?i)power\\s+system"
        - "(?i)ejecutor"
        - "(?i)superintendente"
        - "(?i)superintendencia"
        - "(?i)\\bCAS\\b"
        - "(?i)\\bCIO\\b"
      exempt_window_chars: 40
      review_only_patterns:
        - "(?i)\\bcaso\\s+supervisor\\b"
        - "(?i)\\bsupervisor\\s+exento\\b"
        - "(?i)\\bduplicar\\s+responsabilidades\\b"
        - "(?i)\\bone-up\\b"
        - "(?i)\\bsecci[oó]n\\s+roles\\s+y\\s+responsabilidades\\b"
    llm_refining:
      enabled: true
      gate_prompt: prompts/rules/supervisor_gate.md
      constructor_prompt: prompts/rules/supervisor_constructor.md
      validate_target_in_output: true
      max_tokens: 700
      min_original_overlap_ratio: 0.65
      max_length_ratio: 1.8