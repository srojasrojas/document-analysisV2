paths:
  input_dir: inputs
  output_dir: data/output
  reports_dir: reports
  changes_report: reports/changes.jsonl
  registry_report: reports/registro_cambios.xlsx
  audit_report_json: reports/auditoria_post_run.json
  audit_report_excel: reports/auditoria_post_run.xlsx
  embedded_header_footer_report_jsonl: reports/embedded_header_footer_cleanup.jsonl
  embedded_header_footer_report_excel: reports/embedded_header_footer_cleanup.xlsx
  reference_excel: tmp/referencia.xlsx
  reference_summary: reports/referencia_resumen.md

models:
  deepseek-r1-distill-14b-local:
    provider: ollama
    deployment: deepseek-r1:14b
    base_url: http://192.168.0.24:11434/v1
    api_key: ollama
  openai_api:
    provider: openai
    deployment_env: OPENAI_MODEL
    deployment: gpt-5.4-nano
    api_key_env: OPENAI_API_KEY

pipeline:
  max_passes: 3
  use_llm_refine: false
  overwrite_output: false
  skip_heading_styles: true
  dry_run_keeps_output: false
  reset_reports_on_force: true
  embedded_header_footer_cleanup:
    enabled: true
    action: remove
    apply_before_rules: true
    min_confidence_remove: 0.82
    min_confidence_review: 0.45
    max_removable_chars: 160
    remove_table_artifacts: false
    protect_front_matter_tables: true
    front_matter_table_count: 1
    write_real_footer: true
    overwrite_existing_footer: false
    footer_table_width_inches: 7.0
    footer_font_size_pt: 8
    footer_write_first_even_variants: true
    patterns: []
    table_patterns: []
  post_audit:
    enabled: true
    auto_repair: true

llm_refine:
  model: deepseek-r1-distill-14b-local
  temperature: 0.0
  timeout_seconds: 180
  repair_retries: 1

rules:
  - id: operador_to_spence
    enabled: true
    category: role_expansion
    description: Expand operator responsibility to Spence-designated personnel, certified Spence-designated personnel, or qualified personnel by context.
    detection:
      regex: "(?i)(?<![A-Za-z0-9_])operador(?:\\s*/\\s*a|\\s*\\([aA]\\)|a|es|as)?(?:\\s+a\\s+cargo)?(?:\\s+(?:(?:de|del)\\s+(?:(?:el|la|los|las)\\s+)?)?(?:planta(?:\\s+concentradora)?|equipos?|terreno|sala(?:\\s+de\\s+control)?|control|zona\\s+aut[oó]noma|puentes?\\s+gr[uú]as?|gr[uú]a(?:\\s+horquilla)?|patio(?:\\s+(?:de\\s+)?(?:embarque|c[aá]todos))?(?:\\s+Spence)?|esparcidor|mini\\s*-?\\s*cargador(?:a|es)?|cargador(?:a|es)?(?:\\s+frontal)?|retro\\s*-?\\s*excavadora(?:s)?|excavador(?:a|es)?|cami[oó]n(?:es)?(?:\\s+(?:tolva|pluma))?|camioneta|mina|[aá]rea|proceso|procesos|chancado|molienda|flotaci[oó]n|relaves|maquinaria|operaciones|correas?|apilador(?:a)?|rotopalas?|picarocas?|nave\\s+ew|c[aá]todos|sx|tf|cas|Spence(?:\\s+debidamente\\s+certificad[oa]s?(?:\\s+en\\s+operaci[oó]n\\s+de\\s+puentes?\\s+gr[uú]as?)?)?|(?:MLDC|MDC|EW)(?:\\s+Spence)?|m[aá]quina\\s+despegadora(?:\\s+de\\s+c[aá]todos)?|otras\\s+[aá]reas|circuitos?(?:\\s+de\\s+EW)?|encargad[oa]\\s+(?:de\\s+los\\s+circuitos\\s+de\\s+EW|del\\s+puente\\s+gr[uú]a)))?(?:\\s+(?:autorizad[oa]s?|calificad[oa]s?|capacitad[oa]s?|certificad[oa]s?|competente(?:s)?|habilitad[oa]s?|acreditad[oa]s?|entrenad[oa]s?|designad[oa]s?))?(?![A-Za-z0-9_])"
    replacement:
      mode: expansion
      target_phrase: personal designado por minera Spence
      connector: o
      format: "{matched} {connector} {target}"
      upgradeable_target_phrases:
        - personal designado por minera Spence
      conditional_targets:
        - target_phrase: personal calificado
          reason: qualification_or_technical_operator_context
          context_window_chars: 180
          patterns:
            - "(?i)\\b(?:autorizad[oa]s?|calificad[oa]s?|capacitad[oa]s?|competente(?:s)?|habilitad[oa]s?|acreditad[oa]s?|entrenad[oa]s?)\\b"
            - "(?i)\\b(?:bloqueo|bloquear|desbloqueo|desbloquear|loto|energizaci[oó]n|energizar|desenergizaci[oó]n|desenergizar|hmi|panel\\s+de\\s+control|reset|el[eé]ctric[oa]s?|instrumentaci[oó]n|mantenci[oó]n|calibraci[oó]n|calibrar|homologaci[oó]n|diagn[oó]stico)\\b"
        - target_phrase: personal certificado designado por minera Spence
          reason: equipment_certification_required
          context_window_chars: 180
          match_patterns:
            - "(?i)\\b(?:retro\\s*-?\\s*excavadora(?:s)?|mini\\s*-?\\s*cargador(?:a|es)?|cargador(?:a|es)?(?:\\s+frontal)?|excavador(?:a|es)?|cami[oó]n(?:es)?\\s+(?:tolva|pluma)|rotopalas?|apilador(?:a)?|esparcidor|picarocas?|puentes?\\s+gr[uú]as?|gr[uú]a\\s+horquilla|maquinaria|equipos?|certificad[oa]s?)\\b"
    guards:
      skip_if_target_exists_in_paragraph: false
      skip_if_alternative_exists: true
      alternative_pattern: "(?i)^\\s*(?:o|/|y/o)\\s+(?!(?:personal\\s+designado\\s+por\\s+minera\\s+Spence|personal\\s+certificado\\s+designado\\s+por\\s+minera\\s+Spence|personal\\s+calificado))"
      required_context_patterns:
        - "(?i)\\b(?:debe(?:n|r[aá]n?|r[aá])?|realiza(?:r|n)?|revisa(?:r|n)?|verifica(?:r|n)?|detiene(?:r|n)?|opera(?:r|n)?|inspecciona(?:r|n)?|coordina(?:r|n)?|informa(?:r|n)?|avisa(?:r|n)?|solicita(?:r|n)?|autoriza(?:r|n)?|registra(?:r|n)?|bloquea(?:r|n)?|desbloquea(?:r|n)?|energiza(?:r|n)?|desenergiza(?:r|n)?|comunica(?:r|n)?)\\b"
        - "(?i)\\b(?:dar|da|dando)\\s+aviso\\s+a\\b"
        - "(?i)\\b(?:informar|avisar)\\s+a\\b"
      required_context_window_chars: 180
      exempt_context_patterns:
        - "(?i)\\boperador(?:a|es|as)?\\s+sala\\b"
        - "(?i)sala\\s+de\\s+control"
        - "(?i)\\bCAS\\b"
        - "(?i)\\bCIO\\b"
      exempt_window_chars: 60
      descriptor_order_repair_patterns:
        - "(?:de\\s+(?:el|la|los|las)\\s+|de\\s+|del\\s+)?(?:retro\\s*-?\\s*excavadora(?:s)?|mini\\s*-?\\s*cargador(?:a|es)?|cargador(?:a|es)?(?:\\s+frontal)?|excavador(?:a|es)?|cami[oó]n(?:es)?\\s+(?:tolva|pluma)|rotopalas?|equipos?|terreno|apilador(?:a)?|esparcidor|correas?|picarocas?|gr[uú]a(?:\\s+horquilla)?|puentes?\\s+gr[uú]as?|Spence(?:\\s+debidamente\\s+certificad[oa]s?(?:\\s+en\\s+operaci[oó]n\\s+de\\s+puentes?\\s+gr[uú]as?)?)?|(?:MLDC|MDC|EW|SX|TF)(?:\\s+Spence)?|m[aá]quina\\s+despegadora(?:\\s+de\\s+c[aá]todos)?|patio(?:\\s+(?:de\\s+)?(?:embarque|c[aá]todos))?(?:\\s+Spence)?|c[aá]todos|otras\\s+[aá]reas|embarque|circuitos?(?:\\s+de\\s+EW)?|encargad[oa](?:\\s+(?:de\\s+los\\s+circuitos\\s+de\\s+EW|del\\s+puente\\s+gr[uú]a))?|designad[oa]s?)\\b"
      excluded_section_patterns:
        - "(?i)\\bregistros?\\b"
      review_only_patterns:
        - "(?i)\\bperfil\\s+del\\s+operador\\b"
        - "(?i)\\breemplazos?\\s+de\\s+operador\\b"
      review_only_full_text_patterns: []
    llm_refining:
      enabled: false
      gate_prompt: prompts/rules/operador_gate.md
      constructor_prompt: prompts/rules/operador_constructor.md
      validate_target_in_output: true
      max_tokens: 700
      min_original_overlap_ratio: 0.65
      max_length_ratio: 1.8

  - id: supervisor_to_area_execs
    enabled: true
    category: role_expansion
    description: Expand supervisor responsibility to include Area Executives.
    detection:
      regex: "(?i)(?<![A-Za-z0-9_])(?:supervisor(?:a|es|as)?\\s+(?:de|del)\\s+(?:turno|[aá]rea(?:\\s+de\\s+(?:(?!\\b(?:debe|deber[aá]|para|si|cuando|y|o|u|ejecutivos?)\\b)[A-Za-zÁÉÍÓÚÑáéíóúñ&/.-]+)(?:\\s+(?:(?!\\b(?:debe|deber[aá]|para|si|cuando|y|o|u|ejecutivos?)\\b)[A-Za-zÁÉÍÓÚÑáéíóúñ&/.-]+)){0,5})?|[aá]rea\\s+seca|operaciones?(?:\\s+SPENCE)?|mantenci[oó]n|mantenimiento|producci[oó]n|planta|terreno|zona(?:\\s+aut[oó]noma)?|sala(?:\\s+de\\s+control)?|fcab)|supervisor\\s*\\([ae]\\)|jefe\\s+de\\s+[aá]rea|due[ñn]o\\s+de\\s+[aá]rea|supervisor(?:a|es|as)?(?:\\s+(?!(?:de|del|el|la|los|las|un|una|debe|deber[aá]|para|si|cuando|y|o|u|que|quien|conozca(?:n)?|conocer|ejecutivos?)\\b)[A-Za-zÁÉÍÓÚÑáéíóúñ&/.-]+){0,4})(?![A-Za-z0-9_])"
    replacement:
      mode: expansion
      target_phrase: Ejecutivos del Área
      connector: o
      format: "{matched} {connector} {target}"
      legacy_target_patterns:
        - "experto\\s+t[eé]cnico"
    guards:
      skip_if_target_exists_in_paragraph: true
      skip_if_alternative_exists: true
      alternative_pattern: "(?i)^\\s*(?:o|/|y/o)\\s+(?!Ejecutivos\\s+del\\s+[AÁ]rea)"
      exempt_context_patterns:
        - "(?i)sala\\s+de\\s+control"
        - "(?i)power\\s+system"
        - "(?i)ejecutor"
        - "(?i)superintendente"
        - "(?i)superintendencia"
        - "(?i)\\bCAS\\b"
        - "(?i)\\bCIO\\b"
      exempt_window_chars: 40
      excluded_section_patterns:
        - "(?i)\\bregistros?\\b"
      review_only_patterns:
        - "(?i)\\bse\\s+elimina\\b"
        - "(?i)\\bcaso\\s+supervisor\\b"
        - "(?i)\\bsupervisor\\s+exento\\b"
        - "(?i)\\bduplicar\\s+responsabilidades\\b"
        - "(?i)\\bone-up\\b"
        - "(?i)\\bsecci[oó]n\\s+roles\\s+y\\s+responsabilidades\\b"
      review_only_full_text_patterns:
        - "(?is)\\bsupervisor(?:a|es|as)?\\s+de\\s*$"
        - "(?is)^\\s*(?:supervisor(?:a|es|as)?|jefe\\s+de\\s+[aá]rea|due[ñn]o\\s+de\\s+[aá]rea)(?!.*\\b(?:debe|deber[aá]|informa(?:r)?|coordina(?:r)?|autoriza(?:r)?|solicita(?:r)?|valida(?:r)?|revisa(?:r)?|realiza(?:r)?|avisa(?:r)?|monitorea(?:r)?|recibe(?:r)?|programa(?:r)?|gestiona(?:r)?|detiene(?:r)?|bloquea(?:r)?|comunica(?:r)?)\\b).{0,120}$"
    llm_refining:
      enabled: false
      gate_prompt: prompts/rules/supervisor_gate.md
      constructor_prompt: prompts/rules/supervisor_constructor.md
      validate_target_in_output: true
      max_tokens: 700
      min_original_overlap_ratio: 0.65
      max_length_ratio: 1.8