[project]
name = "docx-rule-engine"
version = "0.1.0"
description = "Configurable multi-rule DOCX replacement and expansion workflow"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]